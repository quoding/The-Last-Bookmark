map $http_x_forwarded_proto $original_scheme {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # Cloudflare Tunnel은 항상 이 컨테이너에 평문 http로 연결하므로 nginx 자신의
    # $scheme은 항상 http다. 클라이언트가 실제로 http/https 중 뭘 썼는지는
    # Cloudflare가 넣어주는 X-Forwarded-Proto로만 알 수 있다. http로 들어왔으면
    # https로 강제 리다이렉트한다 — 안 그러면 프론트 빌드에 고정된
    # https://도메인 API 호출이 스킴 불일치로 CORS에 걸려 전부 실패한다.
    if ($original_scheme = http) {
        return 301 https://$host$request_uri;
    }

    # 백엔드 API. FastAPI 라우터가 이미 /api 접두사를 쓰므로 그대로 넘긴다.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $original_scheme;
    }

    # 관리자 비용 모니터링 페이지. /api 밖에 있는 유일한 백엔드 라우트다.
    location /admin {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $original_scheme;
    }

    # 프론트엔드 정적 빌드. SPA 라우팅이라 없는 경로는 index.html로 넘긴다.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
